description: "Benefits/insurance plan Q&A checker (v3, RAG) — does the LLM answer coverage questions correctly when given retrieved excerpts (not full documents) from a 6-plan SBC library, and does retrieval itself pull back the right document? Chunks are embedded with Voyage AI and retrieved via cosine similarity (scripts/retrieval.js) instead of pasting all documents into every prompt."

prompts:
  - file://scripts/promptfoo-prompt.js

providers:
  - anthropic:messages:claude-sonnet-5
  # - openai:gpt-4o-mini
  # - openai:gpt-4o

defaultTest:
  assert:
    - type: javascript
      metric: answer_correct
      value: |
        // The model is instructed to put a short, specific answer on the first line.
        // We grade by normalizing (lowercase, strip $/,/% ) and checking that the first
        // line contains the expected key fact from our answer key (tests.csv "expected").
        const norm = (s) => String(s).toLowerCase().replace(/[$,%]/g, '').replace(/\s+/g, ' ').trim();
        const firstLine = String(output).trim().split('\n')[0];
        return norm(firstLine).includes(norm(context.vars.expected));
    - type: javascript
      metric: retrieval_correct
      value: file://scripts/assert-retrieval.js

tests: file://tests.csv
